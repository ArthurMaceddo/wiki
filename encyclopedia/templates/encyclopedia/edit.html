{% extends "encyclopedia/layout.html" %} {% block title %}Edit {{ title }} {%endblock %} 
{% block body %}
<h1>Edit {{ title }}</h1>
<form action="{% url 'edit' title %}" method="post">
  {% csrf_token %}
  <textarea class="form-control" name="content">{{ content }}</textarea>
  <br />
  <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
{% endblock %}
